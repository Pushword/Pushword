[package]
name = "pushword-page-facts"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Prototype rendered HTML fact extractor for Pushword page scanning"

[dependencies]
html5ever = "0.39"
regex = "1.13"
scraper = { version = "0.27", default-features = false, features = ["deterministic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"

[lints.rust]
unsafe_code = "forbid"
