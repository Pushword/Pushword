; PHP's 2M default rejects most photos straight off a camera, and the admin's media
; upload is the first thing anyone does.
expose_php = Off
upload_max_filesize = 32M
post_max_size = 32M

; Image derivatives and the OpenGraph image generator are the memory-hungry paths.
memory_limit = 512M

; Sources never change inside the image, so skip the stat() on every include.
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16

realpath_cache_size = 4096K
realpath_cache_ttl = 600
