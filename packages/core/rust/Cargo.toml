[package]
name = "pushword-content-probe"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Optional Pushword content analysis and Markdown compatibility probe"

[dependencies]
comrak = { version = "0.55", default-features = false, features = ["attributes"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = { version = "0.27", default-features = false, features = ["deterministic", "errors"] }
ego-tree = "0.11"

[dev-dependencies]
proptest = "1.11"

[lints.rust]
unsafe_code = "forbid"
