[package]
name = "pushword-content-probe"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Non-production probe of native Pushword content processing"

[dependencies]
comrak = { version = "0.55", default-features = false, features = ["attributes"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
