newsletter:
  audience:
    label:
      plural: Audiences
      singular: Audience
    fieldset:
      identity: Identity
      rules: Rules
      sender: Sender
    field:
      doubleOptIn: Double opt-in
      doubleOptIn.help: Ask for a confirmation click before a subscriber becomes mailable. Leave on unless you are importing a base that already consented.
      fromEmail: From address
      fromName: From name
      interests: Interests
      interests.help: The only interest values the public form may attach. Anything else it submits is dropped.
      mainHost: Host
      mainHost.help: Confirm and unsubscribe links are built from this host's live URL, so they work on a statically generated site.
      name: Name
      rateSeconds: Cadence (s/mail)
      replyTo: Reply-to
      slug: Reference (slug)
      slug.help: The key the subscribe form and the API use.
      utmSource: Analytics source
      utmSource.help: Set it (e.g. newsletter) to tag the links of this audience's mails with utm_source, utm_medium and utm_campaign. Leave empty to send them untouched. Only links to your own sites are tagged.
  automation:
    label:
      plural: Automations
      singular: Automation
    action:
      preview: Preview trigger
    fieldset:
      recipients: Recipients
      steps: Steps
      trigger: Trigger
    field:
      activeFrom: Active from
      activeFrom.help: Nothing that happened before this date ever triggers anything. It stops a new automation from mailing an entire existing base, or announcing an entire back catalogue, at once.
      audience: Audience
      enabled: Enabled
      enabled.help: Disabling pauses the sequence; enrollments keep their place and resume, and nothing new is picked up.
      hosts: Hosts
      hosts.help: The sites to watch, for the sources scoped to one; empty watches every one. An audience often spans several locale hosts, so pick the ones worth a mail.
      name: Name
      recipientWhen: Recipients
      recipientWhen.help: Who receives the mails an occurrence broadcasts, in the usual contact criteria. No condition targets the whole subscribed audience. Ignored when the occurrence names its own contact — a drip is addressed to whoever triggered it.
      source: Trigger on
      source.help: What this watches. "contact" starts a sequence at whoever comes to match; "page" announces a publication to the audience. Other sources come from the bundles you install.
      stepCount: Steps
      steps: Steps
      stopWhen: Stop when
      stopWhen.help: Re-checked before each step of a drip. A match ends the sequence for that contact.
      triggerWhen: Trigger when
      triggerWhen.help: 'Which subjects deserve the sequence — which, not when. No condition matches every one of them, and the fields offered are the source''s own. "Edit as text" gives the stored JSON back, where a page rule may also be written as a pages_list search (ancestor:blog AND tag:featured).'
  campaign:
    label:
      plural: Newsletters
      singular: Newsletter
    action:
      cancelSchedule: Cancel schedule
      previewSegment: Count audience
      schedule: Schedule
      send: Send
      sendTest: Send test
    fieldset:
      audience: Audience & scheduling
      content: Content
      performance: Performance
    field:
      audience: Audience
      body: Body
      bounced: Bounced
      failed: Failed
      preheader: Preheader
      preheader.help: Short preview line shown after the subject in most inboxes.
      rateSeconds: Cadence (s/mail)
      rateSeconds.help: Seconds between two mails. Leave empty to use the audience cadence.
      recipients: Recipients
      scheduledAt: Scheduled for
      scheduledAt.help: Set a date, then use "Schedule". The tick sends it once the date has passed.
      segment: Segment
      segment.help: 'Who this newsletter goes to. No condition targets the whole subscribed audience; "Edit as text" gives the stored JSON back.'
      sent: Sent
      sentAt: Sent at
      slug: Analytics name
      slug.help: Carried as utm_campaign. Derived from the subject when left empty, and prefixed with the send date (YYMMDD) once the newsletter is sent.
      status: Status
      subject: Subject
      unsubscribed: Unsubscribed
    flash:
      backToDraft: Schedule cancelled — back to draft.
      invalidToken: Invalid token, please retry.
      noDate: Set a "Scheduled for" date first, then Schedule.
      notDraft: This newsletter is not a draft any more.
      notFound: Newsletter not found.
    test:
      cancel: Cancel
      help: Delivers the newsletter to the addresses below, with the subject prefixed by [TEST]. Contacts, recipients and stats are untouched.
      recipients: Recipient address(es)
      recipients.help: Comma-, space- or newline-separated. Defaults to your address.
      title: Send a test
  confirm:
    body: Thank you for signing up! To start receiving our emails, click the button below to confirm your email address.
    button: Confirm my subscription
    ignore: If you did not ask for this, ignore this mail — nothing will be sent.
    subject: '%host% - Confirm your subscription'
  confirmed:
    body: You are now subscribed.
    title: Subscription confirmed
  contact:
    label:
      plural: Contacts
      singular: Contact
    action:
      confirm: Confirm by hand
      optIn: Opt in a contact
      optInAnother: Add to another list
      resubscribe: Put back on the list
      unsubscribe: Unsubscribe
    fieldset:
      consent: Consent
      identity: Identity
    field:
      audience: Audience
      audience.help: Changing it moves this subscription to another list. To add one, use "Add to another list".
      bouncedAt: Bounced at
      confirmedAt: Confirmed at
      customProperties: Custom properties
      customProperties.help: YAML key-value pairs. Segments read them as prop.<key>.
      email: Email
      locale: Locale
      name: Name
      optinHost: Opt-in host
      optinIp: Opt-in IP
      registeredAt: Registered at
      source: Source
      status: Status
      tags: Tags
      unsubscribedAt: Unsubscribed at
    flash:
      confirmationSent: Opt-in opened — a confirmation mail is on its way.
      confirmed: Confirmed by hand.
      invalidOptIn: Pick a list and a valid address.
      invalidToken: Invalid token, please retry.
      noAudience: Create an audience first.
      notFound: Contact not found.
      resubscribed: Back on the list.
      subscribed: Subscribed.
      unsubscribed: Unsubscribed.
    optIn:
      alreadyConsented: They already consented
      alreadyConsented.help: Skips the confirmation mail and subscribes right away. Only for consent you can produce — a paper form, a written reply.
      cancel: Cancel
      help: One list at a time, as the public form does. An address already on another list gets a second subscription, with its own consent record.
      title: Opt in a contact
    subscriptions:
      help: The same address on every list of this install. The one being edited is highlighted.
      title: Subscriptions
  criteria:
    addCondition: Add a condition
    addGroup: Add a group
    all: All
    any: Any
    duration: Duration
    empty: No condition — everything matches.
    field: Field
    operator: Operator
    previewContacts: subscribed contact(s)
    previewFailed: This rule could not be counted.
    previewNeedsAudience: Pick an audience to count this rule.
    previewSaveFirst: Save the automation to count what its trigger would catch.
    previewTrigger: waiting
    property: Property key
    raw: Edit as text
    rawHint: The rule as it is stored. Leave it empty to match everything.
    rawInvalid: The builder cannot show this rule, so it is left as written.
    remove: Remove
    searchHint: 'You may also write a pages_list search, e.g. ancestor:blog AND tag:featured'
    sinceAll: Ignore the start date
    toBuilder: Back to the builder
    unitDays: days
    unitHours: hours
    unitMinutes: minutes
    unitWeeks: weeks
    value: Value
  email:
    unsubscribe: Unsubscribe
  form:
    email: Email
    honeypot: Leave this field empty
    name: First name
    submit: Subscribe
  menu:
    label: Newsletter
  resubscribed:
    body: You will receive mail from %audience% again.
    title: Resubscribed
  step:
    field:
      body: Body
      delay: Delay (minutes)
      delay.help: Wait this long after enrollment for the first step, or after the previous step. A contact is enrolled as soon as they are subscribed — with double opt-in, right after they confirm. Two days later is 2880.
      position: Position
      position.help: Order within the sequence, counting from 0. Equal numbers keep the order they were added in.
      subject: Subject
  subscribe:
    done: You are subscribed. Thank you!
    invalidEmail: This email address does not look valid.
    invalidToken: Your form expired. Please reload the page and try again.
    noAudience: Pick at least one newsletter.
    pending: Almost done — click the link we just sent you.
    sendFailed: We could not send the confirmation email. Check your address and try again.
    tooMany: Too many attempts. Please try again later.
    unknownAudience: This newsletter does not exist.
  unknown:
    body: This link is no longer valid.
    title: Unknown link
  unsubscribe:
    body: Confirm that you want to stop receiving mails from %audience%.
    confirm: Unsubscribe me
    title: Unsubscribe
  unsubscribed:
    body: You will not receive any more mail from %audience%.
    othersAll: Unsubscribe me from all of them
    othersBody: Your address is also on these lists. Leaving one says nothing about the others.
    othersConfirm: Unsubscribe me from the ticked lists
    othersTitle: Our other newsletters
    title: Unsubscribed
    undo: Undo, put me back
