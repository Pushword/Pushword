newsletter:
  audience:
    label:
      plural: Audiences
      singular: Audience
    fieldset:
      identity: Identity
      rules: Rules
      sender: Sender
    field:
      doubleOptIn: Double opt-in
      doubleOptIn.help: Ask for a confirmation click before a subscriber becomes mailable. Leave on unless you are importing a base that already consented.
      fromEmail: From address
      fromName: From name
      interests: Interests
      interests.help: The only interest values the public form may attach. Anything else it submits is dropped.
      mainHost: Host
      mainHost.help: Confirm and unsubscribe links are built from this host's live URL, so they work on a statically generated site.
      name: Name
      rateSeconds: Cadence (s/mail)
      replyTo: Reply-to
      slug: Reference (slug)
      slug.help: The key the subscribe form and the API use.
      utmSource: Analytics source
      utmSource.help: Set it (e.g. newsletter) to tag the links of this audience's mails with utm_source, utm_medium and utm_campaign. Leave empty to send them untouched. Only links to your own sites are tagged.
  automation:
    label:
      plural: Automations
      singular: Automation
    action:
      preview: Preview enrollment
    fieldset:
      rules: Rules
      steps: Steps
    field:
      audience: Audience
      enabled: Enabled
      enabled.help: Disabling pauses the sequence; enrollments keep their place and resume.
      enrollFrom: Enroll from
      enrollFrom.help: Contacts registered before this date are never enrolled. It stops a new automation from mailing an entire existing base at once.
      enrollWhen: Enroll when
      enrollWhen.help: 'JSON list of conditions, all of which must hold — who gets enrolled, not when. Empty enrolls every subscribed contact. Example: [{"field":"tag","op":"has","value":"AmTrek"}]; for an OR, {"any":[…]}, which may nest.'
      name: Name
      stepCount: Steps
      steps: Steps
      stopWhen: Stop when
      stopWhen.help: Re-checked before each step. A match ends the sequence for that contact.
  campaign:
    label:
      plural: Newsletters
      singular: Newsletter
    action:
      cancelSchedule: Cancel schedule
      previewSegment: Count audience
      schedule: Schedule
      send: Send
      sendTest: Send test
    fieldset:
      audience: Audience & scheduling
      content: Content
      performance: Performance
    field:
      audience: Audience
      body: Body
      bounced: Bounced
      failed: Failed
      preheader: Preheader
      preheader.help: Short preview line shown after the subject in most inboxes.
      rateSeconds: Cadence (s/mail)
      rateSeconds.help: Seconds between two mails. Leave empty to use the audience cadence.
      recipients: Recipients
      scheduledAt: Scheduled for
      scheduledAt.help: Set a date, then use "Schedule". The tick sends it once the date has passed.
      segment: Segment
      segment.help: 'JSON list of conditions, all of which must hold. Empty targets the whole subscribed audience. Example: [{"field":"prop.lastBoughtProduct","op":"=","value":"tmb"}]; for an OR, {"any":[…]}, which may nest.'
      sent: Sent
      sentAt: Sent at
      slug: Analytics name
      slug.help: Carried as utm_campaign. Derived from the subject when left empty, and prefixed with the send date (YYMMDD) once the newsletter is sent.
      status: Status
      subject: Subject
      unsubscribed: Unsubscribed
    flash:
      backToDraft: Schedule cancelled — back to draft.
      invalidToken: Invalid token, please retry.
      noDate: Set a "Scheduled for" date first, then Schedule.
      notDraft: This newsletter is not a draft any more.
      notFound: Newsletter not found.
    test:
      cancel: Cancel
      help: Delivers the newsletter to the addresses below, with the subject prefixed by [TEST]. Contacts, recipients and stats are untouched.
      recipients: Recipient address(es)
      recipients.help: Comma-, space- or newline-separated. Defaults to your address.
      title: Send a test
  confirm:
    body: Confirm your subscription to %audience% by clicking the button below.
    button: Confirm my subscription
    ignore: If you did not ask for this, ignore this mail — nothing will be sent.
    subject: 'Confirm your subscription to %audience%'
  confirmed:
    body: You are now subscribed to %audience%.
    title: Subscription confirmed
  contact:
    label:
      plural: Contacts
      singular: Contact
    fieldset:
      consent: Consent
      identity: Identity
    field:
      audience: Audience
      bouncedAt: Bounced at
      confirmedAt: Confirmed at
      customProperties: Custom properties
      customProperties.help: YAML key-value pairs. Segments read them as prop.<key>.
      email: Email
      locale: Locale
      name: Name
      optinHost: Opt-in host
      optinIp: Opt-in IP
      registeredAt: Registered at
      source: Source
      status: Status
      tags: Tags
      unsubscribedAt: Unsubscribed at
  contentTrigger:
    label:
      plural: Content triggers
      singular: Content trigger
    action:
      preview: Preview pages
    fieldset:
      mail: Mail
      rules: Rules
    field:
      audience: Audience
      body: Body
      body.help: 'Markdown, with the same placeholders as the subject plus {{ page.mainImage }} for the illustration. Links are made absolute and tagged before sending, as in any newsletter.'
      delay: Delay (minutes)
      delay.help: Wait this long after the page was published. The day after is 1440; 0 sends on the next tick.
      enabled: Enabled
      enabled.help: Disabling stops new pages from being picked up. Campaigns already created are untouched.
      hosts: Hosts
      hosts.help: The sites to watch; empty watches every one. An audience often spans several locale hosts, so pick the ones worth a mail.
      name: Name
      pageWhen: Trigger on pages
      pageWhen.help: 'JSON list of conditions, all of which must hold — which pages, not when. Empty matches every published page of those hosts. Fields: slug, template, tag, parent, ancestor (the slug of a page they sit under, at any depth), prop.<key>. Example: [{"field":"ancestor","op":"=","value":"blog"}]; for an OR, {"any":[…]}, which may nest. A pages_list search works too: ancestor:blog AND tag:featured.'
      segment: Segment
      segment.help: 'Who receives the mail, in the usual contact criteria. Empty targets the whole subscribed audience.'
      subject: Subject
      subject.help: 'May quote {{ page.h1 }}, {{ page.excerpt }} and {{ page.url }}. For example: New article: {{ page.h1 }}'
      triggerFrom: Trigger from
      triggerFrom.help: Pages published before this date never trigger anything. It stops a new trigger from mailing an entire back catalogue at once.
  email:
    unsubscribe: Unsubscribe
  form:
    email: Email
    honeypot: Leave this field empty
    name: First name
    submit: Subscribe
  menu:
    label: Newsletter
  step:
    field:
      body: Body
      delay: Delay (minutes)
      delay.help: Wait this long after enrollment for the first step, or after the previous step. A contact is enrolled as soon as they are subscribed — with double opt-in, right after they confirm. Two days later is 2880.
      position: Position
      subject: Subject
  subscribe:
    done: You are subscribed. Thank you!
    invalidEmail: This email address does not look valid.
    invalidToken: Your form expired. Please reload the page and try again.
    noAudience: Pick at least one newsletter.
    pending: Almost done — click the link we just sent you.
    tooMany: Too many attempts. Please try again later.
    unknownAudience: This newsletter does not exist.
  unknown:
    body: This link is no longer valid.
    title: Unknown link
  unsubscribe:
    body: Confirm that you want to stop receiving mails from %audience%.
    confirm: Unsubscribe me
    title: Unsubscribe
  unsubscribed:
    body: You will not receive any more mail from %audience%.
    othersAll: Unsubscribe me from all of them
    othersBody: Your address is also on these lists. Leaving one says nothing about the others.
    othersConfirm: Unsubscribe me from the ticked lists
    othersTitle: Our other newsletters
    title: Unsubscribed
