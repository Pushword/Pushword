newsletter:
  audience:
    label:
      plural: Audiences
      singular: Audience
    fieldset:
      identity: Identity
      rules: Rules
      sender: Sender
    field:
      clickTracking: Click tracking
      clickTracking.help: Rewrite mail links through a redirect that records who clicked what — but only for contacts carrying their own dated consent. Off, mails keep their links exactly as written (UTM tags included).
      doubleOptIn: Double opt-in
      doubleOptIn.help: Ask for a confirmation click before a subscriber becomes mailable. Leave on unless you are importing a base that already consented.
      fromEmail: From address
      fromName: From name
      interests: Interests
      interests.help: The only interest values the public form may attach. Anything else it submits is dropped.
      mainHost: Host
      mainHost.help: Confirm and unsubscribe links are built from this host's live URL, so they work on a statically generated site.
      name: Name
      postalAddress: Postal address
      postalAddress.help: The sender's real-world address, printed at the foot of every mail this audience sends. US law (CAN-SPAM) requires one on commercial mail; leave empty on an audience that only carries transactional messages.
      rateSeconds: Cadence (s/mail)
      replyTo: Reply-to
      slug: Reference (slug)
      slug.help: The key the subscribe form and the API use.
      transactional: Transactional mail
      transactional.help: Sends every mail of this audience with no unsubscribe link and no List-Unsubscribe header. Only for service messages — an order confirmation, a booking reminder. On a newsletter it is unlawful in the EU and the US, and inboxes treat bulk mail without the header as unattributed.
      utmSource: Analytics source
      utmSource.help: Set it (e.g. newsletter) to tag the links of this audience's mails with utm_source, utm_medium and utm_campaign. Leave empty to send them untouched. Only links to your own sites are tagged.
  automation:
    label:
      plural: Automations
      singular: Automation
    action:
      create: Create automation
      preview: Preview trigger
    fieldset:
      advanced: Advanced options
      recipients: 2. Choose recipients
      recipientsHelp: For a publication, target the relevant subscribers. For a contact event, the sequence goes to the contact who triggers it.
      setup: Your automation
      steps: 3. Write the sequence
      stepsHelp: Add emails in sending order and set the delay between each step.
      trigger: 1. Set the trigger
      triggerHelp: Choose the event that starts the sequence, then narrow it down with conditions if needed.
    field:
      activeFrom: Active from
      activeFrom.help: Only events occurring on or after this date can start the sequence.
      audience: Audience
      enabled: Enabled
      enabled.help: While paused, no new emails are sent. Sequences resume at their current step when reactivated.
      hosts: Hosts
      hosts.help: The sites to watch, for the sources scoped to one; empty watches every one. An audience often spans several locale hosts, so pick the ones worth a mail.
      name: Name
      recipientWhen: Recipients
      recipientWhen.help: With no conditions, every subscriber in this audience receives publication announcements.
      source: Trigger on
      source.help: A contact event starts an individual sequence. A publication emails the selected subscribers.
      stepCount: Steps
      steps: Steps
      stopWhen: Stop when
      stopWhen.help: Re-checked before each step of a drip. A match ends the sequence for that contact.
      transactional: Transactional mail
      transactional.help: Sends this sequence with no unsubscribe link and no List-Unsubscribe header. Only for service messages — an order confirmation, a booking reminder. The audience setting covers everything it sends and this cannot take it back.
      triggerWhen: Trigger when
      triggerWhen.help: Add conditions to limit the events that start this sequence. With no conditions, every event from this source matches.
    source:
      contact: Contact event
      page: Page publication
    status:
      active: Active
      paused: Paused
  campaign:
    label:
      plural: Newsletters
      singular: Newsletter
    action:
      cancelSchedule: Cancel schedule
      create: Create newsletter
      previewSegment: Count audience
      recipients: Recipients
      review: Review and send
      schedule: Schedule
      send: Send
      sendTest: Send test
    fieldset:
      advanced: Advanced options
      audience: 2. Choose recipients
      audienceHelp: Choose an audience. Add conditions to reach a selection of its subscribers.
      content: 1. Write the newsletter
      contentHelp: The subject and preview text help readers decide to open your email.
      languages: Translations
      performance: Delivery results
      schedule: 3. Prepare to send
      scheduleHelp: Save your draft, send a test, then send or schedule from the newsletter details.
    field:
      audience: Audience
      body: Body
      bounced: Bounced
      clicks: Clicks
      failed: Failed
      preheader: Preview text
      preheader.help: Short preview line shown after the subject in most inboxes.
      rateSeconds: Cadence (s/mail)
      rateSeconds.help: Seconds between two mails. Leave empty to use the audience cadence.
      recipients: Recipients
      scheduledAt: Scheduled for
      scheduledAt.help: Optional. After saving, use "Schedule" to confirm sending at this date.
      segment: Segment
      segment.help: 'Who this newsletter goes to. No condition targets the whole subscribed audience; "Edit as text" gives the stored JSON back.'
      sendDate: Send date
      sent: Sent
      sentAt: Sent at
      slug: Analytics name
      slug.help: Carried as utm_campaign. Derived from the subject when left empty, and prefixed with the send date (YYMMDD) once the newsletter is sent.
      status: Status
      subject: Subject
      transactional: Transactional mail
      transactional.help: Sends this one with no unsubscribe link and no List-Unsubscribe header. Only for service messages — an order confirmation, a booking reminder. The audience setting covers everything it sends and this cannot take it back.
      translations: Translations
      translations.help: 'JSON, one entry per locale: {"de": {"subject": "…", "preheader": "…", "bodyMarkdown": "…"}}. A field left out falls back on the text above, so a reader never gets an empty mail. Leave empty to mail everybody the same text.'
      unsubscribed: Unsubscribed
    flash:
      backToDraft: Schedule cancelled — back to draft.
      invalidToken: Invalid token, please retry.
      noDate: Set a "Scheduled for" date first, then Schedule.
      notDraft: This newsletter is not a draft any more.
      notFound: Newsletter not found.
    status:
      draft: Drafts
      scheduled: Scheduled
      sending: Sending
      sent: Sent
    test:
      cancel: Cancel
      help: Delivers the newsletter to the addresses below, with the subject prefixed by [TEST]. Contacts, recipients and stats are untouched.
      locale: Language
      locale.default: The text above (default)
      locale.help: Which translation to proofread. The mail around the body is written in it too.
      recipients: Recipient address(es)
      recipients.help: Comma-, space- or newline-separated. Defaults to your address.
      title: Send a test
    translations:
      invalidJson: Translations must be a JSON object keyed by locale.
      invalidLocale: 'Translation "%locale%" must be an object of subject, preheader and bodyMarkdown.'
  confirm:
    body: Thank you for signing up! To start receiving our emails, confirm your email address below.
    button: Confirm my subscription
    buttonPlain: Confirm (anonymized links)
    buttonTracking: Confirm
    ignore: 'If you did not ask for this, ignore this mail: nothing will be sent.'
    subject: '%host% - Confirm your subscription'
    trackingHint: With your consent, we measure which links you open in our mails, to improve what we send.
  confirmed:
    body: You are now subscribed.
    title: Subscription confirmed
  contact:
    label:
      plural: Contacts
      singular: Contact
    action:
      confirm: Confirm by hand
      merge: Merge the two
      optIn: Opt in a contact
      optInAnother: Add to another list
      resubscribe: Put back on the list
      unsubscribe: Unsubscribe
    events:
      empty: Nothing recorded. This subscription is older than the ledger, or was written straight into the database.
      field:
        host: Host
        ip: IP
        occurredAt: When
        transition: What
      help: What actually happened to this subscription, oldest first. Nothing here is ever edited or removed. The dates in Consent hold where things stand; this holds how they got there, which is what an opt-in is defended with.
      title: Consent history
      transition:
        bounce: Bounced
        confirm: Confirmed
        optin: Opted in
        resubscribe: Put back
        split: Split from another list
        unsubscribe: Unsubscribed
    fieldset:
      consent: Consent
      identity: Identity
    field:
      audience: Audience
      audience.help: Changing it moves this subscription to another list. To add one, use "Add to another list".
      bouncedAt: Bounced at
      clickTrackingConsentAt: Click-tracking consent
      clickTrackingConsentAt.help: When this person consented to per-click logging — the dated proof. Only set it for consent you can produce; clearing it withdraws the consent and purges their recorded clicks.
      confirmedAt: Confirmed at
      customProperties: Custom properties
      customProperties.help: YAML key-value pairs. Segments read them as prop.<key>.
      email: Email
      email.taken: Another contact of this list already uses this address. Merge the two, or change it.
      locale: Locale
      name: Name
      optinHost: Opt-in host
      optinIp: Opt-in IP
      phone: Phone
      phone.help: Kept as digits and a leading +. A contact keyed on a number alone is stored, tagged and segmented, and is never mailed.
      phone.taken: Another contact of this list already uses this number. Merge the two, or change it.
      registeredAt: Registered at
      source: Source
      status: Status
      tags: Tags
      unsubscribedAt: Unsubscribed at
    flash:
      confirmationSent: Opt-in opened — a confirmation mail is on its way.
      confirmed: Confirmed by hand.
      invalidOptIn: Pick a list and either a valid address or a phone number.
      invalidToken: Invalid token, please retry.
      merged: The two rows are one contact now.
      noAudience: Create an audience first.
      notFound: Contact not found.
      resubscribed: Back on the list.
      subscribed: Subscribed.
      unsubscribed: Unsubscribed.
    identifier:
      missing: A contact needs an email address or a phone number.
    merge:
      help: "%kept% and %dropped% look like one person. Merging keeps %kept% — its subscription, its unsubscribe link and everything it was sent — and gives it the number. %dropped% disappears."
      title: The same person, entered twice?
    optIn:
      alreadyConsented: They already consented
      alreadyConsented.help: Skips the confirmation mail and subscribes right away. Only for consent you can produce — a paper form, a written reply.
      cancel: Cancel
      help: One list at a time, as the public form does. An address already on another list gets a second subscription, with its own consent record.
      identifier.help: Either one is enough. A contact with a number and no address is never mailed — no confirmation is asked, and they are subscribed right away.
      title: Opt in a contact
    subscriptions:
      help: The same address on every list of this install. The one being edited is highlighted.
      title: Subscriptions
  criteria:
    addCondition: Add a condition
    addGroup: Add a group
    all: All
    any: Any
    duration: Duration
    empty: No condition — everything matches.
    field: Field
    operator: Operator
    previewContacts: subscribed contact(s)
    previewFailed: This rule could not be counted.
    previewNeedsAudience: Pick an audience to count this rule.
    previewSaveFirst: Save the automation to count what its trigger would catch.
    previewTrigger: waiting
    property: Property key
    raw: Edit as text
    rawHint: The rule as it is stored. Leave it empty to match everything.
    rawInvalid: The builder cannot show this rule, so it is left as written.
    remove: Remove
    searchHint: 'You may also write a pages_list search, e.g. ancestor:blog AND tag:featured'
    sinceAll: Ignore the start date
    toBuilder: Back to the builder
    unitDays: days
    unitHours: hours
    unitMinutes: minutes
    unitWeeks: weeks
    value: Value
  delivery:
    label:
      plural: Deliveries
      singular: Delivery
    field:
      attemptedAt: Attempted at
      automation: Automation
      contact: Contact
      error: Error
      position: Step
      state: State
      subject: Subject
      subjectId: Trigger subject
  email:
    unsubscribe: Unsubscribe
  form:
    email: Email
    honeypot: Leave this field empty
    name: First name
    submit: Subscribe
  menu:
    label: Newsletter
  recipient:
    label:
      plural: Recipients
      singular: Recipient
    field:
      campaign: Newsletter
      clicks: Clicks
      contact: Contact
      error: Error
      sentAt: Sent at
      state: State
  resubscribed:
    body: You will receive mail from %audience% again.
    title: Resubscribed
  step:
    add: Add an email
    empty: Your sequence is empty. Add the first email.
    field:
      body: Body
      delay: Delay (minutes)
      delay.help: Wait this long after enrollment for the first step, or after the previous step. A contact is enrolled as soon as they are subscribed — with double opt-in, right after they confirm. Two days later is 2880.
      position: Position
      position.help: Order within the sequence, counting from 0. Equal numbers keep the order they were added in.
      subject: Subject
  subscribe:
    done: You are subscribed. Thank you!
    invalidEmail: This email address does not look valid.
    invalidToken: Your form expired. Please reload the page and try again.
    noAudience: Pick at least one newsletter.
    pending: Almost done — click the link we just sent you.
    sendFailed: We could not send the confirmation email. Check your address and try again.
    tooMany: Too many attempts. Please try again later.
    unknownAudience: This newsletter does not exist.
  unknown:
    body: This link is no longer valid.
    title: Unknown link
  unsubscribe:
    body: Confirm that you want to stop receiving mails from %audience%.
    confirm: Unsubscribe me
    title: Unsubscribe
  unsubscribed:
    body: You will not receive any more mail from %audience%.
    othersAll: Unsubscribe me from all of them
    othersBody: Your address is also on these lists. Leaving one says nothing about the others.
    othersConfirm: Unsubscribe me from the ticked lists
    othersTitle: Our other newsletters
    title: Unsubscribed
    undo: Undo, put me back
  workspace:
    audienceDescription: Organize your subscriber lists and choose who their emails come from.
    audienceEmptyHint: Create your first audience to group subscribers and configure your sender address.
    audienceEmptyTitle: Start with your audience
    automationDescription: Send an email sequence at the right moment, triggered by a contact event or a publication.
    automationEmptyHint: A welcome email, a follow-up after signup or a new publication. Choose a trigger and write your emails.
    automationEmptyTitle: Your first sequence starts here
    automationdeliveryDescription: Review every email sent by an automation and investigate any failures.
    automationdeliveryEmptyHint: Deliveries will appear here when your automations send their first emails.
    automationdeliveryEmptyTitle: No deliveries yet
    campaignDescription: Write your emails, choose your recipients and follow your deliveries.
    campaignEmptyHint: Share your news with your subscribers. Start with a draft, then send a test before sending.
    campaignEmptyTitle: Create your first newsletter
    campaignrecipientDescription: Review the delivery result for each recipient of this newsletter.
    campaignrecipientEmptyHint: Recipients will appear here once sending has started.
    campaignrecipientEmptyTitle: Sending has not started yet
    contactDescription: Find your subscribers, their contact details and their audience subscriptions.
    contactEmptyHint: Subscribe a contact to an audience to start building your mailing list.
    contactEmptyTitle: Get to know your subscribers
    filterAll: All
    filterStatus: Filter by status
