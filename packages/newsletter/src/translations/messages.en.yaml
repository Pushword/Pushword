        confirm: Confirmed
        optin: Opted in
        resubscribe: Put back
        split: Split from another list
        unsubscribe: Unsubscribed
    fieldset:
      consent: Consent
      identity: Identity
    field:
      audience: Audience
      audience.help: Changing it moves this subscription to another list. To add one, use "Add to another list".
      bouncedAt: Bounced at
      clickTrackingConsentAt: Click-tracking consent
      clickTrackingConsentAt.help: When this person consented to per-click logging — the dated proof. Only set it for consent you can produce; clearing it withdraws the consent and purges their recorded clicks.
      confirmedAt: Confirmed at
      customProperties: Custom properties
      customProperties.help: YAML key-value pairs. Segments read them as prop.<key>.
      email: Email
      email.taken: Another contact of this list already uses this address. Merge the two, or change it.
      locale: Locale
      name: Name
      optinHost: Opt-in host
      optinIp: Opt-in IP
      phone: Phone
      phone.help: Kept as digits and a leading +. A contact keyed on a number alone is stored, tagged and segmented, and is never mailed.
      phone.taken: Another contact of this list already uses this number. Merge the two, or change it.
      registeredAt: Registered at
      source: Source
      status: Status
      tags: Tags
      unsubscribedAt: Unsubscribed at
    flash:
      confirmationSent: Opt-in opened — a confirmation mail is on its way.
      confirmed: Confirmed by hand.
      invalidOptIn: Pick a list and either a valid address or a phone number.
      invalidToken: Invalid token, please retry.
      merged: The two rows are one contact now.
      noAudience: Create an audience first.
      notFound: Contact not found.
      resubscribed: Back on the list.
      subscribed: Subscribed.
      unsubscribed: Unsubscribed.
    identifier:
      missing: A contact needs an email address or a phone number.
    merge:
      help: "%kept% and %dropped% look like one person. Merging keeps %kept% — its subscription, its unsubscribe link and everything it was sent — and gives it the number. %dropped% disappears."
      title: The same person, entered twice?
    optIn:
      alreadyConsented: They already consented
      alreadyConsented.help: Skips the confirmation mail and subscribes right away. Only for consent you can produce — a paper form, a written reply.
      cancel: Cancel
      help: One list at a time, as the public form does. An address already on another list gets a second subscription, with its own consent record.
      identifier.help: Either one is enough. A contact with a number and no address is never mailed — no confirmation is asked, and they are subscribed right away.
      title: Opt in a contact
    status:
      bounced: Bounced
      pending: Pending confirmation
      subscribed: Subscribed
      unsubscribed: Unsubscribed
    subscriptions:
      help: The same address on every list of this install. The one being edited is highlighted.
      title: Subscriptions
