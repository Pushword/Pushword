    button: Je confirme mon inscription
    ignore: Si vous n'êtes pas à l'origine de cette demande, ignorez ce message — rien ne vous sera envoyé.
    subject: '%host% - Confirmez votre inscription'
  confirmed:
    body: Vous êtes désormais inscrit.
    title: Inscription confirmée
  contact:
