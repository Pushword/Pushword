newsletter:
  audience:
    label:
      plural: Audiences
      singular: Audience
    fieldset:
      identity: Identité
      rules: Règles
      sender: Expéditeur
    field:
      doubleOptIn: Double opt-in
      doubleOptIn.help: Demander une confirmation avant qu'un contact devienne joignable. À laisser activé sauf import d'une base ayant déjà consenti.
      fromEmail: Adresse d'expédition
      fromName: Nom d'expéditeur
      interests: Centres d'intérêt
      interests.help: Les seules valeurs que le formulaire public peut attacher. Toute autre valeur soumise est ignorée.
      mainHost: Hôte
      mainHost.help: Les liens de confirmation et de désinscription sont construits depuis l'URL live de cet hôte, pour fonctionner sur un site généré en statique.
      name: Nom
      rateSeconds: Cadence (s/mail)
      replyTo: Répondre à
      slug: Référence (slug)
      slug.help: La clé utilisée par le formulaire d'inscription et l'API.
      utmSource: Source analytics
      utmSource.help: Renseignez-la (par exemple newsletter) pour ajouter utm_source, utm_medium et utm_campaign aux liens des mails de cette audience. Vide, les liens partent tels quels. Seuls les liens vers vos propres sites sont marqués.
  automation:
    label:
      plural: Automatisations
      singular: Automatisation
    action:
      preview: Prévisualiser le déclencheur
    fieldset:
      recipients: Destinataires
      steps: Étapes
      trigger: Déclencheur
    field:
      activeFrom: Actif à partir du
      activeFrom.help: Rien de ce qui s'est produit avant cette date ne déclenche quoi que ce soit. Cela évite qu'une nouvelle automatisation écrive à toute une base existante, ou annonce tout un historique, d'un coup.
      audience: Audience
      enabled: Activé
      enabled.help: 'La désactivation met en pause : les inscriptions gardent leur place et reprennent, et plus rien de nouveau n''est capté.'
      hosts: Sites
      hosts.help: Les sites à surveiller, pour les sources qui s'y limitent ; vide surveille tout. Une audience couvre souvent plusieurs sites de langue, choisissez ceux qui méritent un envoi.
      name: Nom
      recipientWhen: Destinataires
      recipientWhen.help: 'Qui reçoit les envois diffusés, dans les critères de contact habituels. Vide vise toute l''audience abonnée. Ignoré quand l''occurrence désigne son propre contact — un scénario s''adresse à qui l''a déclenché. Exemple : [{"field":"prop.lastSeenAt","op":"olderThan","value":"30d"}]'
      source: Déclencher sur
      source.help: Ce qui est surveillé. « contact » démarre une séquence chez qui vient à correspondre ; « page » annonce une publication à l'audience. Les autres sources viennent des bundles installés.
      stepCount: Étapes
      steps: Étapes
      stopWhen: Arrêter si
      stopWhen.help: Revérifié avant chaque étape d'un scénario. Une correspondance met fin à la séquence pour ce contact.
      triggerWhen: Déclencher quand
      triggerWhen.help: 'Liste JSON de conditions, toutes devant être vraies — quels sujets, pas quand. Vide correspond à tous. Le vocabulaire est celui de la source : une source contact lit tag, locale, createdAt, confirmedAt, prop.<key> ; une source page slug, template, tag, parent, ancestor, prop.<key>, et accepte aussi une recherche pages_list (ancestor:blog AND tag:featured). Pour un OU, {"any":[…]}, imbricable.'
  campaign:
    label:
      plural: Newsletters
      singular: Newsletter
    action:
      cancelSchedule: Annuler la programmation
      previewSegment: Compter l'audience
      schedule: Programmer
      send: Envoyer
      sendTest: Envoyer un test
    fieldset:
      audience: Audience et programmation
      content: Contenu
      performance: Performance
    field:
      audience: Audience
      body: Contenu
      bounced: Rejetés
      failed: Échecs
      preheader: Pré-en-tête
      preheader.help: Courte ligne d'aperçu affichée après l'objet dans la plupart des messageries.
      rateSeconds: Cadence (s/mail)
      rateSeconds.help: Secondes entre deux envois. Laisser vide pour utiliser la cadence de l'audience.
      recipients: Destinataires
      scheduledAt: Programmée pour
      scheduledAt.help: Renseignez une date, puis utilisez « Programmer ». Le tick l'envoie une fois la date passée.
      segment: Segment
      segment.help: 'Liste JSON de conditions, toutes requises. Vide : toute l''audience inscrite. Exemple : [{"field":"prop.lastBoughtProduct","op":"=","value":"tmb"}] ; pour un OU, {"any":[…]}, imbricable.'
      sent: Envoyés
      sentAt: Envoyée le
      slug: Nom analytics
      slug.help: Transmis comme utm_campaign. Déduit de l'objet si laissé vide, et préfixé par la date d'envoi (AAMMJJ) au moment de l'envoi.
      status: Statut
      subject: Objet
      unsubscribed: Désinscrits
    flash:
      backToDraft: Programmation annulée — retour au brouillon.
      invalidToken: Jeton invalide, veuillez réessayer.
      noDate: Renseignez d'abord une date « Programmée pour », puis Programmer.
      notDraft: Cette newsletter n'est plus un brouillon.
      notFound: Newsletter introuvable.
    test:
      cancel: Annuler
      help: Envoie la newsletter aux adresses ci-dessous, objet préfixé par [TEST]. Les contacts, destinataires et statistiques ne sont pas touchés.
      recipients: Adresse(s) destinataire(s)
      recipients.help: Séparées par des virgules, espaces ou retours à la ligne. Votre adresse par défaut.
      title: Envoyer un test
  confirm:
