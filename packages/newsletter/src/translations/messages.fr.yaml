      confirmed: Confirmé à la main.
      invalidOptIn: Choisissez une liste et une adresse valide.
      invalidToken: Jeton invalide, merci de réessayer.
      noAudience: Créez d'abord une audience.
      notFound: Contact introuvable.
      resubscribed: Réinscrit.
      subscribed: Inscrit.
      unsubscribed: Désinscrit.
    optIn:
      alreadyConsented: A déjà consenti
      alreadyConsented.help: Passe le mail de confirmation et inscrit directement. Uniquement pour un consentement que vous pouvez produire — un formulaire papier, une réponse écrite.
      cancel: Annuler
      help: Une liste à la fois, comme le formulaire public. Une adresse déjà présente sur une autre liste reçoit une seconde inscription, avec son propre consentement.
      title: Inscrire un contact
    subscriptions:
      help: La même adresse sur toutes les listes de cette installation. Celle en cours d'édition est surlignée.
