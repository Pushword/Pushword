name: Test installer

on:
  push:
    paths:
      - 'packages/core/install.php'
      - 'packages/*/install.php'
      - 'packages/installer/**'
      - 'packages/new/**'
      - 'packages/*/src/config/services.php'
      - 'packages/*/src/Resources/config/services.php'
      - '.scripts/test-installer'
      - '.scripts/test-partial-install'
      - '.scripts/test-create-project'
      - '.github/workflows/test-installer.yml'
      - 'README.md'
      - 'packages/docs/content/installation.md'
      - 'packages/docs/content/homepage.md'
  pull_request:
    paths:
      - 'packages/core/install.php'
      - 'packages/*/install.php'
      - 'packages/installer/**'
      - 'packages/new/**'
      - 'packages/*/src/config/services.php'
      - 'packages/*/src/Resources/config/services.php'
      - '.scripts/test-partial-install'
      - '.scripts/test-create-project'
      - 'README.md'
      - 'packages/docs/content/installation.md'
      - 'packages/docs/content/homepage.md'
  repository_dispatch:
    types: [after-split-monorepo]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        php: [8.4, 8.5]

    name: Installer P${{ matrix.php }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: pecl
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo, xdebug

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Run installer test
        run: ./.scripts/test-installer

  partial-install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [base, api, flat, conversation, snippet]

    name: Partial install - ${{ matrix.profile }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: pecl
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo, xdebug

      - name: Run partial-install profile
        run: ./.scripts/test-partial-install ${{ matrix.profile }}

  create-project:
    runs-on: ubuntu-latest

    # Resolves the documented install command against real Packagist, which the
    # path-repository installer test structurally cannot do.
    name: Documented create-project

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, iconv

      - name: Resolve documented install command
        run: ./.scripts/test-create-project
