name: Tests

on: [push, pull_request]

jobs:
  phpstan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.5, 8.4]

    name: PHPStan - PHP ${{ matrix.php }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest
          composer-options: --prefer-dist --prefer-stable --no-interaction

      - name: Build container
        # cache:warmup dumps App_KernelDevDebugContainer.xml that phpstan-symfony
        # reads (see phpstan.dist.neon); cache:clear warms then drops that XML.
        run: cd packages/dev-app && php ./bin/console cache:warmup --env=dev

      - name: PHPStan
        run: vendor/bin/phpstan --memory-limit=1G analyse --error-format=github

      - name: Twig CS
        run: vendor/bin/twig-cs-fixer lint --report=github

  js-quality:
    runs-on: ubuntu-latest
    name: JS Type-check, Lint, Editor & Quiz tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install root tooling (eslint, typescript)
        run: yarn install --frozen-lockfile

      - name: Install admin-block-editor dependencies
        run: cd packages/admin-block-editor && yarn install --frozen-lockfile

      - name: Type-check (whole monorepo)
        run: yarn type-check

      - name: Lint admin-block-editor (errors fail the build; any/@ts-ignore are warnings)
        run: yarn eslint packages/admin-block-editor/src --quiet

      - name: Editor unit tests
        run: cd packages/admin-block-editor && yarn test

      - name: Install quiz dependencies
        run: cd packages/quiz && yarn install

      - name: Quiz runtime tests
        run: cd packages/quiz && yarn test

      - name: Install admin dependencies
        run: cd packages/admin && yarn install

      - name: Admin unit tests
        run: cd packages/admin && yarn test

  test:
    runs-on: ${{ matrix.os }}
    permissions:
      # Push the `badges` branch (coverage badge data).
      contents: write
    strategy:
      #fail-fast: true
      matrix:
        os: [ubuntu-latest] #, windows-latest
        php: [8.4, 8.5]
        node: [25, 24]
        stability: [prefer-stable]
        # exclude:
        #   - php: 8.5
        #     node: 24

    name: P${{ matrix.php }} - N${{ matrix.node }} - ${{ matrix.stability }} - ${{ matrix.os }}

    env:
      # Exactly one leg collects coverage and publishes the README badge data,
      # and only for pushes to main; every other leg runs the suite bare.
      PUBLISH_COVERAGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.php == '8.4' && matrix.node == '24' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: pecl
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          # pcov, not xdebug: the badge only needs line coverage, and xdebug slows
          # the whole suite down several-fold to collect it.
          coverage: ${{ env.PUBLISH_COVERAGE == 'true' && 'pcov' || 'none' }}
          ini-values: pcov.directory=${{ github.workspace }}/packages

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Install image optimization tools
        run: sudo apt-get update && sudo apt-get install -y ghostscript qpdf

      #- name: Install browsers
      #  run: vendor/bin/bdi detect drivers
      - name: Initialize
        run: composer reset-dev-app

      - name: Generate Images Cache
        run: cd packages/dev-app && php bin/console pw:image:cache

      - name: Execute tests
        # The 'serial' group holds tests that need exclusive access to the shared
        # public/media variant dir (not per-worker isolatable); run them sequentially
        # after the parallel batch so concurrent workers can't mutate it underneath them.
        # The 'worker' group runs in its own step below (it shares a cache.app version
        # counter that parallel workers would race).
        # Every batch dumps its own coverage; merge-coverage.php folds them. Leaving
        # one out reports its tests as covering nothing.
        run: |
          if [ "$PUBLISH_COVERAGE" = "true" ]; then mkdir cov; COV_PARALLEL="--coverage-php cov/parallel.cov"; COV_SERIAL="--coverage-php cov/serial.cov"; fi
          vendor/bin/paratest --processes=auto $COV_PARALLEL --exclude-group=panther --exclude-group=benchmark --exclude-group=serial --exclude-group=worker
          vendor/bin/paratest --processes=1 $COV_SERIAL --group=serial
        env:
          TEST_RUN_ID: ci-${{ github.run_id }}

      - name: Worker-mode safety guard
        # Simulates a long-running worker (FrankenPHP `worker` / Symfony Runtime) reusing
        # one kernel across requests: asserts the repositories' in-memory caches (slug /
        # redirect maps, media filename index) don't serve stale data after a write in a
        # prior request. A dedicated, named check keeps this non-obvious invariant visible.
        run: |
          if [ "$PUBLISH_COVERAGE" = "true" ]; then COV_WORKER="--coverage-php cov/worker.cov"; fi
          vendor/bin/paratest --processes=1 $COV_WORKER --group=worker
        env:
          TEST_RUN_ID: ci-${{ github.run_id }}

      - name: Publish coverage badge data
        # Merges the three dumps (line-level union — summing per-batch totals would
        # double-count code hit by more than one batch) and force-pushes a one-commit
        # `badges` branch holding the shields.io endpoint JSON the README badge reads.
        # The workflow's own GITHUB_TOKEN is enough: no coverage service, no PAT.
        if: env.PUBLISH_COVERAGE == 'true'
        run: |
          php -d memory_limit=2G .scripts/merge-coverage.php - coverage.xml cov/*.cov
          mkdir badge
          php .scripts/coverage-badge.php coverage.xml > badge/coverage.json
          cd badge
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.json
          git commit -q -m "chore: coverage badge data [skip ci]"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
        env:
          GITHUB_TOKEN: ${{ github.token }}

  test-mariadb:
    runs-on: ubuntu-latest

    name: MariaDB - P8.4 - N24

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: pecl
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, pdo_mysql, mysqli, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          # This job collects no coverage — it exists to surface FK-ordering bugs.
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Install image optimization tools
        run: sudo apt-get update && sudo apt-get install -y ghostscript qpdf

      - name: Create test database user
        run: |
          mysql -h127.0.0.1 -uroot -proot -e "CREATE USER IF NOT EXISTS 'pushword'@'%' IDENTIFIED BY 'pushword'; GRANT ALL PRIVILEGES ON \`pushword\_test%\`.* TO 'pushword'@'%'; FLUSH PRIVILEGES;"

      - name: Initialize
        run: composer reset-dev-app

      - name: Generate Images Cache
        run: cd packages/dev-app && php bin/console pw:image:cache

      - name: Execute tests
        # Serial and worker groups run after the parallel batch — see the SQLite job above.
        run: |
          vendor/bin/paratest --processes=auto --exclude-group=panther --exclude-group=benchmark --exclude-group=serial --exclude-group=worker
          vendor/bin/paratest --processes=1 --group=serial
        env:
          TEST_RUN_ID: ci-mariadb-${{ github.run_id }}
          PUSHWORD_TEST_MYSQL_URL: "mysql://pushword:pushword@127.0.0.1:3306/pushword_test?serverVersion=11.8.6-MariaDB&charset=utf8mb4"

      - name: Worker-mode safety guard
        # Same guard as the SQLite job: worker tests share a cache.app version
        # counter that parallel workers would race, so they run alone.
        run: vendor/bin/paratest --processes=1 --group=worker
        env:
          TEST_RUN_ID: ci-mariadb-${{ github.run_id }}
          PUSHWORD_TEST_MYSQL_URL: "mysql://pushword:pushword@127.0.0.1:3306/pushword_test?serverVersion=11.8.6-MariaDB&charset=utf8mb4"
